<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Hall Scheme App ksadlkasdlk</title>

    <style>
      #vue_hall_scheme_app {
        width: 1440px;
        max-width: 95%;
        margin: 0 auto;
        height: 70vh;
        border: 1px solid blue;
      }
    </style>
  </head>
  <body>
    <button id="fetchSelectionBtn" style="margin-left: 500px;">fetch places</button>
    <button id="confirmSelectionBtn">confirm selection</button>

    <section id="vue_hall_scheme_app"></section>
    <section id="vue_hall_scheme_app_2"></section>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { VueHallSchemeView } from './src/main.js'

      import { MAP_PLACES } from './map.js'
      const places = MAP_PLACES

      const fetchSelectionBtn = document.getElementById('fetchSelectionBtn')
      const confirmSelectionBtn = document.getElementById('confirmSelectionBtn')

      const vueHallSchemeApp = new VueHallSchemeView({
        el: '#vue_hall_scheme_app',
      })

      vueHallSchemeApp.create()
        .mount()

      const hallSchemeApp2 = new VueHallSchemeView({
        el: '#vue_hall_scheme_app_2',
      })

      hallSchemeApp2.create()
        .mount()

      fetchSelectionBtn.onclick = () => {
        console.log(fetchSelectionBtn)
        vueHallSchemeApp.setSchemeSeatsToApp(places)
      }

      // фильтр выделения мест
      vueHallSchemeApp.setSelectionFilters({
        attrs: {
          opened: true,
          reserve_status: ['available', 'reserved_my'],
        }
      })

      confirmSelectionBtn.onclick = () => {
        const placesIds = vueHallSchemeApp.getSelectedSeats()

        // HACK: имитация бэка
        // вместо этого нужно обновить места на бэке,
        // и получить новые места
        for (let id in placesIds) {
          places[id].border_color = 'none'
          places[id].reserve_status = 'reserved_my'
          places[id].bg_color = 'red'
        }

        const newPlaces = structuredClone(places)
        // HACK: имитация бэка

        // прокидываем обновлённые места в схему
        vueHallSchemeApp.setSchemeSeatsToApp(newPlaces)
      }
    </script>

  </body>
</html>
