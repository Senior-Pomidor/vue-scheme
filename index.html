<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Hall Scheme App ksadlkasdlk</title>

    <!-- <link rel="stylesheet" href="/dist/style.css"> -->

    <style>
      #vue_hall_scheme_app {
        width: 1440px;
        max-width: 95%;
        margin: 0 auto;
        height: 70vh;
        border: 1px solid blue;
      }
      .buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="buttons">
      <button id="fetchSelectionBtn">fetch places 1k</button>
      <button id="fetchSelectionBtn7K">fetch places 7k</button>
      <button id="fetchSelectionBtn45k">fetch places 45k</button>
      <button id="confirmSelectionBtn">confirm selection</button>
      <button id="clearSelectionBtn">clear selection</button>
      <!-- <button id="clearSelectedSeatsBtn">clear selection</button> -->
    </div>
    <br>
    <div class="buttons">
      <button id="changeFiltersAvailable">Available seats</button>
      <button id="changeFiltersClosed">Closed seats</button>
      <button id="changeFiltersWidgetSellChannel">Widget sell channel seats</button>
      <button id="changeFiltersClosedAllSellChannels">All sell channels seats</button>
      <!-- <button id="clearSelectedSeatsBtn">clear selection</button> -->
    </div>

    <section id="vue_hall_scheme_app"></section>
    <section id="vue_hall_scheme_app_2"></section>

    <script type="module" src="/src/main.js"></script>
    <!-- <script type="module" src="/dist/vue_hall_scheme_view.js"></script> -->
    <script type="module">
      import { VueHallSchemeView } from './src/main.js'
      // import { VueHallSchemeView } from '/dist/vue_hall_scheme_view.js'

      import {
          // MAP_PLACES,
          MAP_PLACES_7K,
      } from './map.js'
      import { MAP_PLACES } from './map_prod_test.js'
      import { MAP_PLACES_45K } from './map_45k.js'

      const places = MAP_PLACES
      const places_7k = MAP_PLACES_7K
      const places_45k = MAP_PLACES_45K

      const fetchSelectionBtn = document.getElementById('fetchSelectionBtn')
      const fetchSelectionBtn7K = document.getElementById('fetchSelectionBtn7K')
      const fetchSelectionBtn45K = document.getElementById('fetchSelectionBtn45k')
      const confirmSelectionBtn = document.getElementById('confirmSelectionBtn')
      const clearSelectionBtn = document.getElementById('clearSelectionBtn')
      const changeFiltersAvailable = document.getElementById('changeFiltersAvailable')
      const changeFiltersClosed = document.getElementById('changeFiltersClosed')
      const changeFiltersWidgetSellChannel = document.getElementById('changeFiltersWidgetSellChannel')
      const changeFiltersClosedAllSellChannels = document.getElementById('changeFiltersClosedAllSellChannels')
      // const clearSelectedSeatsBtn = document.getElementById('clearSelectedSeatsBtn')

      const vueHallSchemeApp = new VueHallSchemeView('#vue_hall_scheme_app')

      let newPlaces = {}

      fetchSelectionBtn.onclick = () => {
        newPlaces = structuredClone(places)
        vueHallSchemeApp.setSchemeSeatsToApp(newPlaces)
      }

      fetchSelectionBtn7K.onclick = () => {
        newPlaces = structuredClone(places_7k)
        vueHallSchemeApp.setSchemeSeatsToApp(newPlaces)
      }

      fetchSelectionBtn45k.onclick = () => {
        newPlaces = structuredClone(places_45k)
        vueHallSchemeApp.setSchemeSeatsToApp(newPlaces)
      }

      // фильтр выделения мест
      vueHallSchemeApp.setSelectionFilters({
        attrs: {
          // x: 25,
          status: ['available'],
          sell_channels: {
            // is_widget: false, // виджет
            // is_api: true, // шлюзы
            // is_cashbox: true, // касса
          },

        }
      })

      // clearSelectedSeatsBtn.onclick = () => {
      //   vueHallSchemeApp.clearSelectedSeats()
      // }

      confirmSelectionBtn.onclick = () => {
        const placesIds = vueHallSchemeApp.getSelectedSeats()

        // HACK: имитация бэка
        // вместо этого нужно обновить места на бэке,
        // и получить новые места
        for (let id in placesIds) {
          newPlaces[id].border_color = 'none'
          newPlaces[id].status = 'closed'
          newPlaces[id].reserved_by_user = true
          newPlaces[id].bg_color = 'red'
        }

        // const newPlacesChunk = structuredClone(places)
        // HACK: имитация бэка

        // прокидываем обновлённые места в схему
        // vueHallSchemeApp.setSchemeSeatsToApp(newPlaces)
        vueHallSchemeApp.updateSeatsChunk(newPlaces)
      }

      clearSelectionBtn.onclick = () => {
        vueHallSchemeApp.clearSelectedSeats()
      }

      let schemeFilters = {}

      changeFiltersAvailable.onclick = () => {
        schemeFilters = {
          attrs: {
            status: ['available'],
          },
        }

        vueHallSchemeApp.setSelectionFilters(schemeFilters)
      }

      changeFiltersClosed.onclick = () => {
        schemeFilters = {
          attrs: {
            status: ['closed'],
          },
        }

        vueHallSchemeApp.setSelectionFilters(schemeFilters)
      }

      changeFiltersWidgetSellChannel.onclick = () => {
        schemeFilters = {
          attrs: {
            ...schemeFilters.attrs,
            sell_channels: {
              is_widget: true,
            },
          }
        }

        vueHallSchemeApp.setSelectionFilters(schemeFilters)
      }

      changeFiltersClosedAllSellChannels.onclick = () => {
        schemeFilters = {
          attrs: {
            ...schemeFilters.attrs,
            sell_channels: {
              // is_widget: false,
              // is_api: false,
              // is_cashbox: false,
            },
          }
        }

        vueHallSchemeApp.setSelectionFilters(schemeFilters)
      }
    </script>
  </body>
</html>
