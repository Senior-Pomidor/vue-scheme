stages:
  - build

.rules_master_auto_run: &rules_master_auto_run
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: always
  - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
    when: manual

.tags_builder: &tags_builder
  - builder

build-job:
  stage: build
  image: node:16.20
  timeout: 30 minutes
  rules: *rules_master_auto_run
  tags: *tags_builder
  script:
    - npm install && npm run build
